local_backend: true

backend:
  name: git-gateway
  branch: main

media_folder: "public/images"
public_folder: "/images"

locale: "de"

slug:
  encoding: "ascii"
  clean_accents: true

collections:
  # ═══════════════════════════════════════
  # MEINE SEITEN - Texte bearbeiten
  # ═══════════════════════════════════════
  - name: "seiten"
    label: "Meine Seiten"
    description: "Hier kannst du alle Texte auf deiner Website bearbeiten."
    files:

      - label: "Startseite"
        name: "startseite"
        file: "src/content/texts/01-startseite.json"
        description: "Die Hauptseite mit Begrüßung, Mission und Abschluss."
        fields:
          - { label: "Tagline (DE)", name: "hero_tagline_de", widget: "string", hint: "Der kleine Text ganz oben" }
          - { label: "Tagline (EN)", name: "hero_tagline_en", widget: "string" }
          - { label: "Untertitel (DE)", name: "hero_subtitle_de", widget: "text", hint: "Der Text unter dem großen Titel" }
          - { label: "Subtitle (EN)", name: "hero_subtitle_en", widget: "text" }
          - { label: "Button Buchen (DE)", name: "hero_bookBtn_de", widget: "string" }
          - { label: "Button Book (EN)", name: "hero_bookBtn_en", widget: "string" }
          - { label: "Button Mehr erfahren (DE)", name: "hero_learnMore_de", widget: "string" }
          - { label: "Button Learn more (EN)", name: "hero_learnMore_en", widget: "string" }
          - { label: "Mission Titel (DE)", name: "mission_title_de", widget: "string" }
          - { label: "Mission Title (EN)", name: "mission_title_en", widget: "string" }
          - { label: "Mission Text 1 (DE)", name: "mission_p1_de", widget: "text" }
          - { label: "Mission Text 1 (EN)", name: "mission_p1_en", widget: "text" }
          - { label: "Mission Text 2 (DE)", name: "mission_p2_de", widget: "text" }
          - { label: "Mission Text 2 (EN)", name: "mission_p2_en", widget: "text" }
          - { label: "Mission Text 3 (DE)", name: "mission_p3_de", widget: "text" }
          - { label: "Mission Text 3 (EN)", name: "mission_p3_en", widget: "text" }
          - { label: "Abschluss Titel (DE)", name: "cta_title_de", widget: "string", hint: "Der Titel ganz unten auf der Seite" }
          - { label: "Closing Title (EN)", name: "cta_title_en", widget: "string" }
          - { label: "Abschluss Text (DE)", name: "cta_text_de", widget: "text" }
          - { label: "Closing Text (EN)", name: "cta_text_en", widget: "text" }
          - { label: "Button Buchen (DE)", name: "cta_bookBtn_de", widget: "string" }
          - { label: "Button Book (EN)", name: "cta_bookBtn_en", widget: "string" }
          - { label: "Button Kontakt (DE)", name: "cta_contactBtn_de", widget: "string" }
          - { label: "Button Contact (EN)", name: "cta_contactBtn_en", widget: "string" }

      - label: "Was ist Reiki"
        name: "was-ist-reiki"
        file: "src/content/texts/02a-was-ist-reiki.json"
        description: "Die Erklärung was Reiki ist."
        fields:
          - { label: "Titel (DE)", name: "whatIsReiki_title_de", widget: "string" }
          - { label: "Title (EN)", name: "whatIsReiki_title_en", widget: "string" }
          - { label: "Einleitung (DE)", name: "whatIsReiki_intro_de", widget: "text" }
          - { label: "Introduction (EN)", name: "whatIsReiki_intro_en", widget: "text" }
          - { label: "Hinweis kursiv (DE)", name: "whatIsReiki_note_de", widget: "text", hint: "Wird kursiv angezeigt" }
          - { label: "Note italic (EN)", name: "whatIsReiki_note_en", widget: "text" }
          - { label: "Haupttext (DE)", name: "whatIsReiki_body_de", widget: "text" }
          - { label: "Main text (EN)", name: "whatIsReiki_body_en", widget: "text" }
          - { label: "Button Buchen (DE)", name: "whatIsReiki_bookBtn_de", widget: "string" }
          - { label: "Button Book (EN)", name: "whatIsReiki_bookBtn_en", widget: "string" }
          - { label: "Button Ablauf (DE)", name: "whatIsReiki_sessionBtn_de", widget: "string" }
          - { label: "Button Session flow (EN)", name: "whatIsReiki_sessionBtn_en", widget: "string" }
          - { label: "Button Vorteile (DE)", name: "whatIsReiki_benefitsBtn_de", widget: "string" }
          - { label: "Button Benefits (EN)", name: "whatIsReiki_benefitsBtn_en", widget: "string" }

      - label: "Vorteile von Reiki"
        name: "vorteile"
        file: "src/content/texts/02b-vorteile.json"
        description: "Die Vorteile aufgeteilt in körperlich, emotional und mental."
        fields:
          - { label: "Titel (DE)", name: "reikiBenefits_title_de", widget: "string" }
          - { label: "Title (EN)", name: "reikiBenefits_title_en", widget: "string" }
          - { label: "Einleitung (DE)", name: "reikiBenefits_intro_de", widget: "text" }
          - { label: "Introduction (EN)", name: "reikiBenefits_intro_en", widget: "text" }
          - { label: "Kategorie Körperlich (DE)", name: "reikiBenefits_physical_de", widget: "string" }
          - { label: "Category Physical (EN)", name: "reikiBenefits_physical_en", widget: "string" }
          - { label: "Körperliche Vorteile (DE)", name: "reikiBenefits_physicalItems_de", widget: "text", hint: "Einträge mit | trennen. Beispiel: Kann Schmerzen lindern|Verbessert den Schlaf" }
          - { label: "Physical Benefits (EN)", name: "reikiBenefits_physicalItems_en", widget: "text", hint: "Separate with |" }
          - { label: "Kategorie Emotional (DE)", name: "reikiBenefits_emotional_de", widget: "string" }
          - { label: "Category Emotional (EN)", name: "reikiBenefits_emotional_en", widget: "string" }
          - { label: "Emotionale Vorteile (DE)", name: "reikiBenefits_emotionalItems_de", widget: "text", hint: "Einträge mit | trennen" }
          - { label: "Emotional Benefits (EN)", name: "reikiBenefits_emotionalItems_en", widget: "text", hint: "Separate with |" }
          - { label: "Kategorie Mental (DE)", name: "reikiBenefits_mental_de", widget: "string" }
          - { label: "Category Mental (EN)", name: "reikiBenefits_mental_en", widget: "string" }
          - { label: "Mentale Vorteile (DE)", name: "reikiBenefits_mentalItems_de", widget: "text", hint: "Einträge mit | trennen" }
          - { label: "Mental Benefits (EN)", name: "reikiBenefits_mentalItems_en", widget: "text", hint: "Separate with |" }

      - label: "Reiki vs Fern-Reiki"
        name: "vergleich"
        file: "src/content/texts/02c-vergleich.json"
        description: "Der Vergleich zwischen Reiki vor Ort und Fern-Reiki."
        fields:
          - { label: "Titel (DE)", name: "comparison_title_de", widget: "string" }
          - { label: "Title (EN)", name: "comparison_title_en", widget: "string" }
          - { label: "Reiki vor Ort Titel (DE)", name: "comparison_reikiTitle_de", widget: "string" }
          - { label: "In-Person Title (EN)", name: "comparison_reikiTitle_en", widget: "string" }
          - { label: "Reiki vor Ort Text (DE)", name: "comparison_reikiBody_de", widget: "text" }
          - { label: "In-Person Text (EN)", name: "comparison_reikiBody_en", widget: "text" }
          - { label: "Fern-Reiki Titel (DE)", name: "comparison_remoteTitle_de", widget: "string" }
          - { label: "Distance Title (EN)", name: "comparison_remoteTitle_en", widget: "string" }
          - { label: "Fern-Reiki Text (DE)", name: "comparison_remoteBody_de", widget: "text" }
          - { label: "Distance Text (EN)", name: "comparison_remoteBody_en", widget: "text" }

      - label: "Nach der Session"
        name: "nach-der-session"
        file: "src/content/texts/02d-nach-der-session.json"
        description: "Tipps für nach der Reiki-Session."
        fields:
          - { label: "Titel (DE)", name: "afterSession_title_de", widget: "string" }
          - { label: "Title (EN)", name: "afterSession_title_en", widget: "string" }
          - { label: "Untertitel (DE)", name: "afterSession_subtitle_de", widget: "string" }
          - { label: "Subtitle (EN)", name: "afterSession_subtitle_en", widget: "string" }
          - { label: "Tipp 1 Titel (DE)", name: "afterSession_rest_de", widget: "string" }
          - { label: "Tip 1 Title (EN)", name: "afterSession_rest_en", widget: "string" }
          - { label: "Tipp 1 Text (DE)", name: "afterSession_restDesc_de", widget: "text" }
          - { label: "Tip 1 Text (EN)", name: "afterSession_restDesc_en", widget: "text" }
          - { label: "Tipp 2 Titel (DE)", name: "afterSession_journal_de", widget: "string" }
          - { label: "Tip 2 Title (EN)", name: "afterSession_journal_en", widget: "string" }
          - { label: "Tipp 2 Text (DE)", name: "afterSession_journalDesc_de", widget: "text" }
          - { label: "Tip 2 Text (EN)", name: "afterSession_journalDesc_en", widget: "text" }
          - { label: "Tipp 3 Titel (DE)", name: "afterSession_movement_de", widget: "string" }
          - { label: "Tip 3 Title (EN)", name: "afterSession_movement_en", widget: "string" }
          - { label: "Tipp 3 Text (DE)", name: "afterSession_movementDesc_de", widget: "text" }
          - { label: "Tip 3 Text (EN)", name: "afterSession_movementDesc_en", widget: "text" }
          - { label: "Tipp 4 Titel (DE)", name: "afterSession_water_de", widget: "string" }
          - { label: "Tip 4 Title (EN)", name: "afterSession_water_en", widget: "string" }
          - { label: "Tipp 4 Text (DE)", name: "afterSession_waterDesc_de", widget: "text" }
          - { label: "Tip 4 Text (EN)", name: "afterSession_waterDesc_en", widget: "text" }
          - { label: "Tipp 5 Titel (DE)", name: "afterSession_calm_de", widget: "string" }
          - { label: "Tip 5 Title (EN)", name: "afterSession_calm_en", widget: "string" }
          - { label: "Tipp 5 Text (DE)", name: "afterSession_calmDesc_de", widget: "text" }
          - { label: "Tip 5 Text (EN)", name: "afterSession_calmDesc_en", widget: "text" }

      - label: "Sound & Soul"
        name: "sound-and-soul"
        file: "src/content/texts/03-sound-and-soul.json"
        description: "Alles rund um Sound & Soul."
        fields:
          - { label: "Titel (DE)", name: "soundAndSoul_title_de", widget: "string" }
          - { label: "Title (EN)", name: "soundAndSoul_title_en", widget: "string" }
          - { label: "Untertitel (DE)", name: "soundAndSoul_subtitle_de", widget: "string" }
          - { label: "Subtitle (EN)", name: "soundAndSoul_subtitle_en", widget: "string" }
          - { label: "Text 1 (DE)", name: "soundAndSoul_p1_de", widget: "text" }
          - { label: "Text 1 (EN)", name: "soundAndSoul_p1_en", widget: "text" }
          - { label: "Text 2 (DE)", name: "soundAndSoul_p2_de", widget: "text" }
          - { label: "Text 2 (EN)", name: "soundAndSoul_p2_en", widget: "text" }
          - { label: "Button Buchen (DE)", name: "soundAndSoul_bookBtn_de", widget: "string" }
          - { label: "Button Book (EN)", name: "soundAndSoul_bookBtn_en", widget: "string" }
          - { label: "Coming Soon Text (DE)", name: "soundAndSoul_comingSoon_de", widget: "string" }
          - { label: "Coming Soon Text (EN)", name: "soundAndSoul_comingSoon_en", widget: "string" }
          - { label: "Hinweis-Text (DE)", name: "soundAndSoul_comingText_de", widget: "text" }
          - { label: "Notice Text (EN)", name: "soundAndSoul_comingText_en", widget: "text" }
          - { label: "Button Kontakt (DE)", name: "soundAndSoul_contactBtn_de", widget: "string" }
          - { label: "Button Contact (EN)", name: "soundAndSoul_contactBtn_en", widget: "string" }

      - label: "Über mich - Einführung"
        name: "ueber-mich-intro"
        file: "src/content/texts/04a-ueber-mich-intro.json"
        description: "Deine Vorstellung und der erste Eindruck."
        fields:
          - { label: "Kleine Überschrift (DE)", name: "about_tagline_de", widget: "string" }
          - { label: "Small Heading (EN)", name: "about_tagline_en", widget: "string" }
          - { label: "Begrüßung (DE)", name: "about_greeting_de", widget: "string", hint: "z.B. Hi, ich bin Kiki." }
          - { label: "Greeting (EN)", name: "about_greeting_en", widget: "string" }
          - { label: "Intro Text 1 (DE)", name: "about_intro1_de", widget: "text" }
          - { label: "Intro Text 1 (EN)", name: "about_intro1_en", widget: "text" }
          - { label: "Intro Text 2 (DE)", name: "about_intro2_de", widget: "text" }
          - { label: "Intro Text 2 (EN)", name: "about_intro2_en", widget: "text" }

      - label: "Über mich - Mein Weg"
        name: "mein-weg"
        file: "src/content/texts/04b-mein-weg.json"
        description: "Deine Geschichte, wie du zu Reiki gekommen bist."
        fields:
          - { label: "Titel (DE)", name: "about_storyTitle_de", widget: "string" }
          - { label: "Title (EN)", name: "about_storyTitle_en", widget: "string" }
          - { label: "Absatz 1 (DE)", name: "about_story1_de", widget: "text" }
          - { label: "Paragraph 1 (EN)", name: "about_story1_en", widget: "text" }
          - { label: "Absatz 2 (DE)", name: "about_story2_de", widget: "text" }
          - { label: "Paragraph 2 (EN)", name: "about_story2_en", widget: "text" }
          - { label: "Absatz 3 (DE)", name: "about_story3_de", widget: "text" }
          - { label: "Paragraph 3 (EN)", name: "about_story3_en", widget: "text" }
          - { label: "Absatz 4 (DE)", name: "about_story4_de", widget: "text" }
          - { label: "Paragraph 4 (EN)", name: "about_story4_en", widget: "text" }
          - { label: "Absatz 5 (DE)", name: "about_story5_de", widget: "text" }
          - { label: "Paragraph 5 (EN)", name: "about_story5_en", widget: "text" }

      - label: "Über mich - Persönliches"
        name: "persoenliches"
        file: "src/content/texts/04c-persoenliches.json"
        description: "Deine Interessen, Freuden und Werte."
        fields:
          - { label: "Titel Persönliches (DE)", name: "about_factsTitle_de", widget: "string" }
          - { label: "Title Personal (EN)", name: "about_factsTitle_en", widget: "string" }
          - { label: "Leidenschaften Titel (DE)", name: "about_passionsTitle_de", widget: "string" }
          - { label: "Passions Title (EN)", name: "about_passionsTitle_en", widget: "string" }
          - { label: "Leidenschaften (DE)", name: "about_passions_de", widget: "text", hint: "Einträge mit | trennen. Beispiel: Yoga|Sport|Bücher" }
          - { label: "Passions (EN)", name: "about_passions_en", widget: "text", hint: "Separate with |" }
          - { label: "Kleine Freuden Titel (DE)", name: "about_joysTitle_de", widget: "string" }
          - { label: "Little Joys Title (EN)", name: "about_joysTitle_en", widget: "string" }
          - { label: "Kleine Freuden (DE)", name: "about_joys_de", widget: "text", hint: "Einträge mit | trennen" }
          - { label: "Little Joys (EN)", name: "about_joys_en", widget: "text", hint: "Separate with |" }
          - { label: "Wonach ich lebe Titel (DE)", name: "about_valuesTitle_de", widget: "string" }
          - { label: "What I live by Title (EN)", name: "about_valuesTitle_en", widget: "string" }
          - { label: "Absatz 1 (DE)", name: "about_values1_de", widget: "text" }
          - { label: "Paragraph 1 (EN)", name: "about_values1_en", widget: "text" }
          - { label: "Absatz 2 (DE)", name: "about_values2_de", widget: "text" }
          - { label: "Paragraph 2 (EN)", name: "about_values2_en", widget: "text" }
          - { label: "Absatz 3 (DE)", name: "about_values3_de", widget: "text" }
          - { label: "Paragraph 3 (EN)", name: "about_values3_en", widget: "text" }

      - label: "Buchung & Kontakt"
        name: "buchung-kontakt"
        file: "src/content/texts/05-buchung-kontakt.json"
        description: "Texte auf der Buchungs- und Kontaktseite."
        fields:
          - { label: "Buchung Titel (DE)", name: "booking_title_de", widget: "string" }
          - { label: "Booking Title (EN)", name: "booking_title_en", widget: "string" }
          - { label: "Buchung Untertitel (DE)", name: "booking_subtitle_de", widget: "string" }
          - { label: "Booking Subtitle (EN)", name: "booking_subtitle_en", widget: "string" }
          - { label: "Platzhalter (DE)", name: "booking_placeholder_de", widget: "text" }
          - { label: "Placeholder (EN)", name: "booking_placeholder_en", widget: "text" }
          - { label: "Fallback (DE)", name: "booking_fallback_de", widget: "text" }
          - { label: "Fallback (EN)", name: "booking_fallback_en", widget: "text" }
          - { label: "Button E-Mail (DE)", name: "booking_emailBtn_de", widget: "string" }
          - { label: "Button Email (EN)", name: "booking_emailBtn_en", widget: "string" }
          - { label: "Kontakt Titel (DE)", name: "contact_title_de", widget: "string" }
          - { label: "Contact Title (EN)", name: "contact_title_en", widget: "string" }
          - { label: "Kontakt Untertitel (DE)", name: "contact_subtitle_de", widget: "string" }
          - { label: "Contact Subtitle (EN)", name: "contact_subtitle_en", widget: "string" }
          - { label: "Feld Name (DE)", name: "contact_name_de", widget: "string" }
          - { label: "Field Name (EN)", name: "contact_name_en", widget: "string" }
          - { label: "Platzhalter Name (DE)", name: "contact_namePlaceholder_de", widget: "string" }
          - { label: "Placeholder Name (EN)", name: "contact_namePlaceholder_en", widget: "string" }
          - { label: "Feld E-Mail (DE)", name: "contact_email_de", widget: "string" }
          - { label: "Field Email (EN)", name: "contact_email_en", widget: "string" }
          - { label: "Platzhalter E-Mail (DE)", name: "contact_emailPlaceholder_de", widget: "string" }
          - { label: "Placeholder Email (EN)", name: "contact_emailPlaceholder_en", widget: "string" }
          - { label: "Feld Nachricht (DE)", name: "contact_message_de", widget: "string" }
          - { label: "Field Message (EN)", name: "contact_message_en", widget: "string" }
          - { label: "Platzhalter Nachricht (DE)", name: "contact_messagePlaceholder_de", widget: "string" }
          - { label: "Placeholder Message (EN)", name: "contact_messagePlaceholder_en", widget: "string" }
          - { label: "Button Senden (DE)", name: "contact_sendBtn_de", widget: "string" }
          - { label: "Button Send (EN)", name: "contact_sendBtn_en", widget: "string" }

      - label: "Navigation & Footer"
        name: "nav-footer"
        file: "src/content/texts/06-navigation-footer.json"
        description: "Menü-Bezeichnungen und Footer-Texte."
        fields:
          - { label: "Home (DE)", name: "nav_home_de", widget: "string" }
          - { label: "Home (EN)", name: "nav_home_en", widget: "string" }
          - { label: "Reiki (DE)", name: "nav_reiki_de", widget: "string" }
          - { label: "Reiki (EN)", name: "nav_reiki_en", widget: "string" }
          - { label: "Sound & Soul (DE)", name: "nav_soundAndSoul_de", widget: "string" }
          - { label: "Sound & Soul (EN)", name: "nav_soundAndSoul_en", widget: "string" }
          - { label: "Testimonials (DE)", name: "nav_testimonials_de", widget: "string" }
          - { label: "Testimonials (EN)", name: "nav_testimonials_en", widget: "string" }
          - { label: "Über mich (DE)", name: "nav_about_de", widget: "string" }
          - { label: "About me (EN)", name: "nav_about_en", widget: "string" }
          - { label: "Button Buchen (DE)", name: "nav_book_de", widget: "string" }
          - { label: "Button Book (EN)", name: "nav_book_en", widget: "string" }
          - { label: "Testimonials Titel (DE)", name: "testimonials_title_de", widget: "string" }
          - { label: "Testimonials Title (EN)", name: "testimonials_title_en", widget: "string" }
          - { label: "Testimonials Untertitel (DE)", name: "testimonials_subtitle_de", widget: "string" }
          - { label: "Testimonials Subtitle (EN)", name: "testimonials_subtitle_en", widget: "string" }
          - { label: "Footer Text (DE)", name: "footer_description_de", widget: "text" }
          - { label: "Footer Text (EN)", name: "footer_description_en", widget: "text" }
          - { label: "Footer Seiten (DE)", name: "footer_pages_de", widget: "string" }
          - { label: "Footer Pages (EN)", name: "footer_pages_en", widget: "string" }
          - { label: "Footer Kontakt (DE)", name: "footer_contact_de", widget: "string" }
          - { label: "Footer Contact (EN)", name: "footer_contact_en", widget: "string" }

  # ═══════════════════════════════════════
  # KUNDENSTIMMEN
  # ═══════════════════════════════════════
  - name: "testimonials"
    label: "Kundenstimmen"
    label_singular: "Kundenstimme"
    description: "Feedback und Bewertungen deiner Kunden."
    folder: "src/content/testimonials"
    create: true
    slug: "{{slug}}"
    summary: "{{name}}"
    fields:
      - { label: "Name des Kunden", name: "name", widget: "string", hint: "z.B. Kundin aus Berlin oder nur Vorname" }
      - { label: "Bewertung (Deutsch)", name: "text_de", widget: "text" }
      - { label: "Review (English)", name: "text_en", widget: "text" }
      - { label: "Datum", name: "date", widget: "datetime" }

  # ═══════════════════════════════════════
  # ANGEBOTE & PREISE
  # ═══════════════════════════════════════
  - name: "services"
    label: "Angebote & Preise"
    label_singular: "Angebot"
    description: "Deine Sessions und deren Preise."
    folder: "src/content/services"
    create: true
    slug: "{{slug}}"
    summary: "{{name_de}} — {{price}}€"
    fields:
      - { label: "Name (Deutsch)", name: "name_de", widget: "string", hint: "z.B. Reiki Session" }
      - { label: "Name (English)", name: "name_en", widget: "string" }
      - { label: "Beschreibung (Deutsch)", name: "description_de", widget: "text", hint: "Beschreibe was in der Session enthalten ist" }
      - { label: "Description (English)", name: "description_en", widget: "text" }
      - { label: "Dauer in Minuten", name: "duration", widget: "number", value_type: "int", min: 15, hint: "z.B. 75" }
      - { label: "Preis in Euro", name: "price", widget: "number", value_type: "int", min: 0, hint: "z.B. 90" }
      - label: "Art der Session"
        name: "type"
        widget: "select"
        options:
          - { label: "Reiki (vor Ort)", value: "reiki" }
          - { label: "Fern-Reiki (online)", value: "remote-reiki" }
          - { label: "Sound & Soul", value: "sound-and-soul" }
      - { label: "Aktiv (auf der Website sichtbar)", name: "active", widget: "boolean", default: true, hint: "Ausschalten um das Angebot vorübergehend zu verstecken" }

  # ═══════════════════════════════════════
  # NEUE SEITEN
  # ═══════════════════════════════════════
  - name: "neue-seiten"
    label: "Eigene Seiten"
    label_singular: "Seite"
    description: "Erstelle eigene neue Seiten für deine Website."
    folder: "src/content/pages"
    create: true
    slug: "{{slug}}"
    summary: "{{title_de}}"
    fields:
      - { label: "Seitentitel (Deutsch)", name: "title_de", widget: "string", hint: "Wird als Überschrift und im Browser-Tab angezeigt" }
      - { label: "Page Title (English)", name: "title_en", widget: "string" }
      - { label: "URL-Pfad", name: "slug", widget: "string", hint: "Nur Kleinbuchstaben und Bindestriche. z.B. mein-neues-angebot" }
      - { label: "Inhalt (Deutsch)", name: "body_de", widget: "markdown", hint: "Dein Seiteninhalt. Du kannst Überschriften, Listen, fetten Text und Bilder verwenden." }
      - { label: "Content (English)", name: "body_en", widget: "markdown" }
      - { label: "Bild (optional)", name: "image", widget: "image", required: false, hint: "Ein Bild das oben auf der Seite angezeigt wird" }
      - { label: "Veröffentlicht", name: "published", widget: "boolean", default: false, hint: "Einschalten damit die Seite auf der Website sichtbar wird" }

