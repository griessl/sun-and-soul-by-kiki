<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sun & Soul by Kiki — Admin</title>
  </head>
  <body>
    <div id="nc-root"></div>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      CMS.registerPreviewStyle("/admin/preview-styles.css");

      // ═══ Language state (stored in window so previews can access it) ═══
      window.__lang = 'de';

      // ═══ Helpers ═══
      const g = (entry, name) => entry.getIn(['data', name]) || '';
      const L = (entry, base) => g(entry, `${base}_${window.__lang}`);
      const split = (val) => (val || '').split('|').filter(Boolean);

      // ═══ Toolbar Component (reusable, no overlap with Decap icons) ═══
      function Toolbar(sectionName, component) {
        const isDE = window.__lang === 'de';
        const btnStyle = (active) => ({
          background: active ? '#C4956A' : 'transparent',
          border: '1px solid ' + (active ? '#C4956A' : 'rgba(250,247,242,0.3)'),
          color: '#FAF7F2', padding: '4px 16px', fontSize: '11px',
          cursor: 'pointer', borderRadius: '3px', fontFamily: 'inherit',
          fontWeight: active ? '600' : '400',
        });
        return h('div', {
          style: {
            background: '#4A3728', color: '#FAF7F2',
            padding: '10px 16px', fontSize: '12px',
            fontFamily: '-apple-system, BlinkMacSystemFont, sans-serif',
            display: 'flex', justifyContent: 'space-between', alignItems: 'center',
            marginBottom: '0',
          }
        },
          h('span', { style: { fontWeight: '500' } }, sectionName),
          h('div', { style: { display: 'flex', gap: '6px', marginRight: '80px' } },
            h('button', { onClick: () => { window.__lang = 'de'; component.forceUpdate(); }, style: btnStyle(isDE) }, 'Deutsch'),
            h('button', { onClick: () => { window.__lang = 'en'; component.forceUpdate(); }, style: btnStyle(!isDE) }, 'English')
          )
        );
      }

      // ═══ Startseite ═══
      CMS.registerPreviewTemplate('startseite', createClass({
        render() {
          const e = this.props.entry;
          return h('div', {},
            Toolbar('Startseite', this),
            h('div', { className: 'section section-center', style: { minHeight: '50vh', display: 'flex', alignItems: 'center', justifyContent: 'center' } },
              h('div', {},
                h('p', { className: 'tag' }, L(e, 'hero_tagline')),
                h('h1', { style: { fontSize: '3.5rem', marginBottom: '0.5rem' } }, 'Sun & Soul'),
                h('h1', { style: { fontSize: '3.5rem', marginTop: 0 } }, 'by Kiki'),
                h('p', { style: { fontSize: '1.15rem', maxWidth: '32rem', margin: '1.5rem auto', opacity: 0.85 } }, L(e, 'hero_subtitle')),
                h('div', { className: 'btn-row' },
                  h('span', { className: 'btn btn-primary' }, L(e, 'hero_bookBtn')),
                  h('span', { className: 'btn btn-outline' }, L(e, 'hero_learnMore'))
                )
              )
            ),
            h('div', { className: 'section' },
              h('div', { className: 'sh' }, h('h2', {}, L(e, 'mission_title'))),
              h('p', { style: { marginBottom: '1rem' } }, L(e, 'mission_p1')),
              h('p', { style: { marginBottom: '1rem' } }, L(e, 'mission_p2')),
              h('p', {}, L(e, 'mission_p3'))
            ),
            h('hr', { className: 'sep' }),
            h('div', { className: 'section section-center' },
              h('h2', { style: { fontSize: '2rem', marginBottom: '1rem' } }, L(e, 'cta_title')),
              h('p', { style: { marginBottom: '1.5rem' } }, L(e, 'cta_text')),
              h('div', { className: 'btn-row' },
                h('span', { className: 'btn btn-primary' }, L(e, 'cta_bookBtn')),
                h('span', { className: 'btn btn-outline' }, L(e, 'cta_contactBtn'))
              )
            )
          );
        }
      }));

      // ═══ Was ist Reiki ═══
      CMS.registerPreviewTemplate('was-ist-reiki', createClass({
        render() {
          const e = this.props.entry;
          return h('div', {},
            Toolbar('Was ist Reiki', this),
            h('div', { className: 'section section-alt section-center' },
              h('div', { className: 'sh' }, h('h2', {}, L(e, 'whatIsReiki_title'))),
              h('p', { style: { marginBottom: '1rem' } }, L(e, 'whatIsReiki_intro')),
              h('p', { style: { fontStyle: 'italic', marginBottom: '1rem' } }, L(e, 'whatIsReiki_note')),
              h('p', { style: { marginBottom: '2rem' } }, L(e, 'whatIsReiki_body')),
              h('div', { className: 'btn-row' },
                h('span', { className: 'btn btn-primary' }, L(e, 'whatIsReiki_bookBtn')),
                h('span', { className: 'btn btn-outline' }, L(e, 'whatIsReiki_sessionBtn')),
                h('span', { className: 'btn btn-outline' }, L(e, 'whatIsReiki_benefitsBtn'))
              )
            )
          );
        }
      }));

      // ═══ Vorteile ═══
      CMS.registerPreviewTemplate('vorteile', createClass({
        render() {
          const e = this.props.entry;
          const cats = [
            ['reikiBenefits_physical', 'reikiBenefits_physicalItems'],
            ['reikiBenefits_emotional', 'reikiBenefits_emotionalItems'],
            ['reikiBenefits_mental', 'reikiBenefits_mentalItems'],
          ];
          return h('div', {},
            Toolbar('Vorteile von Reiki', this),
            h('div', { className: 'section section-alt' },
              h('div', { className: 'sh' }, h('h2', {}, L(e, 'reikiBenefits_title'))),
              h('p', { className: 'section-center', style: { marginBottom: '2rem', maxWidth: '42rem', margin: '0 auto 2rem' } }, L(e, 'reikiBenefits_intro')),
              h('div', { className: 'grid-3' },
                ...cats.map(([titleKey, itemsKey]) =>
                  h('div', { className: 'card' },
                    h('div', { className: 'cat-title' }, L(e, titleKey)),
                    h('ul', { className: 'list' },
                      ...split(L(e, itemsKey)).map(item => h('li', {}, item))
                    )
                  )
                )
              )
            )
          );
        }
      }));

      // ═══ Vergleich ═══
      CMS.registerPreviewTemplate('vergleich', createClass({
        render() {
          const e = this.props.entry;
          return h('div', {},
            Toolbar('Reiki vs Fern-Reiki', this),
            h('div', { className: 'section section-alt' },
              h('div', { className: 'sh' }, h('h2', {}, L(e, 'comparison_title'))),
              h('div', { className: 'grid-2' },
                h('div', { className: 'card' },
                  h('h3', { style: { textAlign: 'center', fontSize: '1.4rem', marginBottom: '1rem' } }, L(e, 'comparison_reikiTitle')),
                  h('p', {}, L(e, 'comparison_reikiBody'))
                ),
                h('div', { className: 'card' },
                  h('h3', { style: { textAlign: 'center', fontSize: '1.4rem', marginBottom: '1rem' } }, L(e, 'comparison_remoteTitle')),
                  h('p', {}, L(e, 'comparison_remoteBody'))
                )
              )
            )
          );
        }
      }));

      // ═══ Nach der Session ═══
      CMS.registerPreviewTemplate('nach-der-session', createClass({
        render() {
          const e = this.props.entry;
          const tips = ['rest', 'journal', 'movement', 'water', 'calm'];
          return h('div', {},
            Toolbar('Nach der Session', this),
            h('div', { className: 'section section-alt' },
              h('div', { className: 'sh' },
                h('h2', {}, L(e, 'afterSession_title')),
                h('p', { className: 'sh-sub' }, L(e, 'afterSession_subtitle'))
              ),
              ...tips.map(tip =>
                h('div', { className: 'tip' },
                  h('div', { className: 'tip-title' }, L(e, `afterSession_${tip}`)),
                  h('p', { style: { maxWidth: '36rem', margin: '0 auto' } }, L(e, `afterSession_${tip}Desc`))
                )
              )
            )
          );
        }
      }));

      // ═══ Sound & Soul ═══
      CMS.registerPreviewTemplate('sound-and-soul', createClass({
        render() {
          const e = this.props.entry;
          return h('div', {},
            Toolbar('Sound & Soul', this),
            h('div', { className: 'section section-center' },
              h('p', { className: 'tag' }, L(e, 'soundAndSoul_comingSoon')),
              h('div', { className: 'sh' },
                h('h2', {}, L(e, 'soundAndSoul_title')),
                h('p', { className: 'sh-sub' }, L(e, 'soundAndSoul_subtitle'))
              ),
              h('p', { style: { marginBottom: '1rem' } }, L(e, 'soundAndSoul_p1')),
              h('p', { style: { marginBottom: '2rem' } }, L(e, 'soundAndSoul_p2')),
              h('div', { className: 'btn-row' },
                h('span', { className: 'btn btn-primary' }, L(e, 'soundAndSoul_bookBtn'))
              )
            )
          );
        }
      }));

      // ═══ Über mich - Intro ═══
      CMS.registerPreviewTemplate('ueber-mich-intro', createClass({
        render() {
          const e = this.props.entry;
          return h('div', {},
            Toolbar('Über mich — Einführung', this),
            h('div', { className: 'section' },
              h('p', { className: 'tag' }, L(e, 'about_tagline')),
              h('h1', { style: { fontSize: '2.75rem' } }, L(e, 'about_greeting')),
              h('p', { style: { marginTop: '1rem', marginBottom: '0.75rem' } }, L(e, 'about_intro1')),
              h('p', {}, L(e, 'about_intro2'))
            )
          );
        }
      }));

      // ═══ Mein Weg ═══
      CMS.registerPreviewTemplate('mein-weg', createClass({
        render() {
          const e = this.props.entry;
          return h('div', {},
            Toolbar('Mein Weg zum Reiki', this),
            h('div', { className: 'section section-alt' },
              h('div', { className: 'sh' }, h('h2', {}, L(e, 'about_storyTitle'))),
              ...[1,2,3,4,5].map(i =>
                h('p', { style: { marginBottom: '1rem' } }, L(e, `about_story${i}`))
              )
            )
          );
        }
      }));

      // ═══ Persönliches ═══
      CMS.registerPreviewTemplate('persoenliches', createClass({
        render() {
          const e = this.props.entry;
          return h('div', {},
            Toolbar('Persönliches', this),
            h('div', { className: 'section' },
              h('div', { className: 'sh' }, h('h2', {}, L(e, 'about_factsTitle'))),
              h('div', { className: 'grid-2' },
                h('div', { className: 'card' },
                  h('h3', { style: { fontSize: '1.15rem', marginBottom: '1rem' } }, L(e, 'about_passionsTitle')),
                  h('ul', { className: 'list' },
                    ...split(L(e, 'about_passions')).map(i => h('li', {}, i))
                  )
                ),
                h('div', { className: 'card' },
                  h('h3', { style: { fontSize: '1.15rem', marginBottom: '1rem' } }, L(e, 'about_joysTitle')),
                  h('ul', { className: 'list' },
                    ...split(L(e, 'about_joys')).map(i => h('li', {}, i))
                  )
                )
              )
            ),
            h('div', { className: 'section section-alt section-center' },
              h('div', { className: 'sh' }, h('h2', {}, L(e, 'about_valuesTitle'))),
              h('p', { style: { marginBottom: '1rem' } }, L(e, 'about_values1')),
              h('p', { style: { marginBottom: '1rem' } }, L(e, 'about_values2')),
              h('p', {}, L(e, 'about_values3'))
            )
          );
        }
      }));

      // ═══ Buchung & Kontakt ═══
      CMS.registerPreviewTemplate('buchung-kontakt', createClass({
        render() {
          const e = this.props.entry;
          return h('div', {},
            Toolbar('Buchung & Kontakt', this),
            h('div', { className: 'section section-center' },
              h('div', { className: 'sh' }, h('h2', {}, L(e, 'booking_title'))),
              h('p', { className: 'sh-sub' }, L(e, 'booking_subtitle')),
              h('div', { className: 'card', style: { padding: '2.5rem', marginTop: '1.5rem' } },
                h('p', { style: { marginBottom: '1rem' } }, L(e, 'booking_placeholder')),
                h('p', { style: { opacity: 0.6, fontSize: '0.9rem', marginBottom: '1rem' } }, L(e, 'booking_fallback')),
                h('span', { className: 'btn btn-primary' }, L(e, 'booking_emailBtn'))
              )
            ),
            h('hr', { className: 'sep' }),
            h('div', { className: 'section' },
              h('div', { className: 'sh' },
                h('h2', {}, L(e, 'contact_title')),
                h('p', { className: 'sh-sub' }, L(e, 'contact_subtitle'))
              ),
              h('div', { style: { maxWidth: '28rem', margin: '0 auto' } },
                ['name', 'email', 'message'].map(field =>
                  h('div', { style: { marginBottom: '1.25rem' } },
                    h('label', { style: { display: 'block', fontSize: '0.75rem', letterSpacing: '0.1em', textTransform: 'uppercase', marginBottom: '0.5rem' } },
                      L(e, `contact_${field}`)
                    ),
                    field === 'message'
                      ? h('div', { style: { background: 'rgba(254,252,249,0.6)', border: '1px solid #EDE5D8', padding: '0.75rem 1rem', minHeight: '100px', opacity: 0.5, fontSize: '0.9rem' } }, L(e, `contact_${field}Placeholder`))
                      : h('div', { style: { background: 'rgba(254,252,249,0.6)', border: '1px solid #EDE5D8', padding: '0.75rem 1rem', opacity: 0.5, fontSize: '0.9rem' } }, L(e, `contact_${field}Placeholder`))
                  )
                ),
                h('div', { style: { textAlign: 'center', marginTop: '1.5rem' } },
                  h('span', { className: 'btn btn-primary' }, L(e, 'contact_sendBtn'))
                )
              )
            )
          );
        }
      }));

      // ═══ Navigation & Footer ═══
      CMS.registerPreviewTemplate('nav-footer', createClass({
        render() {
          const e = this.props.entry;
          return h('div', {},
            Toolbar('Navigation & Footer', this),
            // Nav preview
            h('div', { style: { background: 'rgba(245,240,232,0.9)', padding: '1rem 1.5rem', display: 'flex', justifyContent: 'space-between', alignItems: 'center', backdropFilter: 'blur(8px)' } },
              h('div', {},
                h('span', { style: { fontFamily: "'Playfair Display', serif", fontSize: '1.15rem', fontWeight: 600, fontStyle: 'italic', color: '#4A3728' } }, 'Sun & Soul'),
                h('br'),
                h('span', { style: { fontSize: '0.8rem', letterSpacing: '0.1em', color: '#4A3728' } }, 'by Kiki')
              ),
              h('div', { style: { display: 'flex', gap: '1.5rem', alignItems: 'center', fontSize: '0.75rem', letterSpacing: '0.05em', textTransform: 'uppercase' } },
                h('span', { style: { color: '#8B6F47' } }, L(e, 'nav_home')),
                h('span', { style: { color: '#8B6F47' } }, L(e, 'nav_reiki')),
                h('span', { style: { color: '#8B6F47' } }, L(e, 'nav_soundAndSoul')),
                h('span', { style: { color: '#8B6F47' } }, L(e, 'nav_testimonials')),
                h('span', { style: { color: '#8B6F47' } }, L(e, 'nav_about')),
                h('span', { className: 'btn btn-primary', style: { padding: '0.4rem 1.2rem', fontSize: '0.7rem' } }, L(e, 'nav_book'))
              )
            ),
            h('div', { style: { height: '150px', display: 'flex', alignItems: 'center', justifyContent: 'center' } },
              h('p', { style: { opacity: 0.4, fontStyle: 'italic' } }, '... Seiteninhalt ...')
            ),
            // Footer preview
            h('div', { style: { background: '#4A3728', color: '#FAF7F2', padding: '2.5rem 1.5rem' } },
              h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '2rem' } },
                h('div', {},
                  h('div', { style: { fontFamily: "'Playfair Display', serif", fontSize: '1.4rem', fontStyle: 'italic', marginBottom: '0.5rem' } }, 'Sun & Soul'),
                  h('div', { style: { fontSize: '0.8rem', letterSpacing: '0.1em', marginBottom: '1rem' } }, 'by Kiki'),
                  h('p', { style: { fontSize: '0.85rem', opacity: 0.7, lineHeight: 1.6 } }, L(e, 'footer_description'))
                ),
                h('div', {},
                  h('div', { style: { fontFamily: "'Playfair Display', serif", fontSize: '1rem', marginBottom: '0.75rem' } }, L(e, 'footer_pages')),
                  h('div', { style: { fontSize: '0.85rem', opacity: 0.7, lineHeight: 2 } },
                    [L(e, 'nav_home'), L(e, 'nav_reiki'), L(e, 'nav_soundAndSoul'), L(e, 'nav_testimonials'), L(e, 'nav_about')].map(item =>
                      h('div', {}, item)
                    )
                  )
                ),
                h('div', {},
                  h('div', { style: { fontFamily: "'Playfair Display', serif", fontSize: '1rem', marginBottom: '0.75rem' } }, L(e, 'footer_contact'))
                )
              ),
              h('div', { style: { marginTop: '2rem', paddingTop: '1.5rem', borderTop: '1px solid rgba(139,111,71,0.3)', textAlign: 'center', fontSize: '0.7rem', opacity: 0.6 } },
                'Impressum · Datenschutz',
                h('br'),
                '© 2026 Sun & Soul by Kiki'
              )
            )
          );
        }
      }));

      // ═══ Kundenstimmen ═══
      CMS.registerPreviewTemplate('testimonials', createClass({
        render() {
          const e = this.props.entry;
          return h('div', {},
            Toolbar('Kundenstimme', this),
            h('div', { className: 'section' },
              h('div', { className: 'card', style: { textAlign: 'center', padding: '2.5rem' } },
                h('p', { style: { fontStyle: 'italic', fontSize: '1.1rem', marginBottom: '1rem' } },
                  '\u201C', g(e, `text_${window.__lang}`), '\u201D'
                ),
                h('p', { style: { color: '#C4956A', fontSize: '0.8rem', letterSpacing: '0.1em', textTransform: 'uppercase' } }, g(e, 'name'))
              )
            )
          );
        }
      }));

      // ═══ Angebote & Preise ═══
      CMS.registerPreviewTemplate('services', createClass({
        render() {
          const e = this.props.entry;
          return h('div', {},
            Toolbar('Angebot', this),
            h('div', { className: 'section' },
              h('div', { className: 'card', style: { textAlign: 'center' } },
                h('h3', { style: { fontSize: '1.5rem', marginBottom: '0.5rem' } }, g(e, `name_${window.__lang}`)),
                h('p', { style: { color: '#C4956A', fontSize: '1.75rem', fontFamily: "'Playfair Display', serif", marginBottom: '0.25rem' } }, g(e, 'price'), ' €'),
                h('p', { style: { opacity: 0.6, fontSize: '0.85rem', marginBottom: '1.25rem' } }, g(e, 'duration'), window.__lang === 'de' ? ' Minuten' : ' minutes'),
                h('p', { style: { fontSize: '0.9rem', marginBottom: '1.5rem' } }, g(e, `description_${window.__lang}`)),
                h('span', { className: 'btn btn-primary' }, window.__lang === 'de' ? 'Termin buchen' : 'Book a session')
              )
            )
          );
        }
      }));

      // ═══ Eigene Seiten ═══
      CMS.registerPreviewTemplate('neue-seiten', createClass({
        render() {
          const e = this.props.entry;
          const img = g(e, 'image');
          const alt = g(e, 'image_alt');
          const slug = g(e, 'slug');
          const published = e.getIn(['data', 'published']);
          return h('div', {},
            Toolbar('Eigene Seite', this),
            // URL + Status bar
            h('div', { style: { background: '#FAF7F2', padding: '8px 16px', fontSize: '11px', fontFamily: '-apple-system, sans-serif', display: 'flex', justifyContent: 'space-between', color: '#8B6F47', borderBottom: '1px solid #EDE5D8' } },
              h('span', {}, slug ? (window.__lang === 'de' ? `sunandsoulbykiki.de/seiten/${slug}` : `sunandsoulbykiki.de/en/pages/${slug}`) : 'URL wird aus dem Pfad generiert'),
              h('span', { style: { color: published ? '#4a8f3f' : '#C4956A' } }, published ? '● Veröffentlicht' : '○ Entwurf')
            ),
            img ? h('img', { src: img, alt: alt, style: { width: '100%', height: '300px', objectFit: 'cover' } }) : null,
            h('div', { className: 'section section-center' },
              h('h1', { style: { fontSize: '2.75rem', marginBottom: '1.5rem' } }, g(e, `title_${window.__lang}`)),
              h('div', { className: 'prose' }, this.props.widgetFor(`body_${window.__lang}`))
            )
          );
        }
      }));

      // ═══ Einstellungen ═══
      CMS.registerPreviewTemplate('site', createClass({
        render() {
          const e = this.props.entry;
          const row = (label, value) => h('div', { style: { display: 'flex', justifyContent: 'space-between', padding: '12px 0', borderBottom: '1px solid #EDE5D8' } },
            h('span', { style: { fontWeight: '500', color: '#4A3728', fontSize: '0.85rem' } }, label),
            h('span', { style: { color: '#8B6F47', fontSize: '0.85rem' } }, value || '—')
          );
          return h('div', {},
            h('div', { style: { background: '#4A3728', color: '#FAF7F2', padding: '10px 16px', fontSize: '12px', fontFamily: '-apple-system, sans-serif', fontWeight: '500' } }, 'Einstellungen'),
            h('div', { className: 'section' },
              h('div', { className: 'sh' }, h('h2', {}, 'Deine Kontaktdaten')),
              h('div', { className: 'card' },
                row('E-Mail', g(e, 'email')),
                row('Instagram', g(e, 'instagram')),
                row('Instagram Link', g(e, 'instagramUrl')),
                row('Standort', g(e, 'location')),
                row('Cal.com URL', g(e, 'calcomUrl')),
                row('Web3Forms Key', g(e, 'web3formsKey') ? '●●●●●●' : 'Noch nicht eingerichtet')
              ),
              h('div', { style: { marginTop: '2rem' } },
                h('p', { style: { fontSize: '0.8rem', opacity: 0.6, fontFamily: '-apple-system, sans-serif' } },
                  'Diese Daten werden auf der Website für den Footer, das Kontaktformular und die Buchungsseite verwendet.'
                )
              )
            )
          );
        }
      }));
    </script>
  </body>
</html>
